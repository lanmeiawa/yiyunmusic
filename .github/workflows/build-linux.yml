name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 Release tag（例如 v2.0.3）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win --x64 --publish never
            path: |
              dist-release/*.exe
            name: windows
          - os: ubuntu-latest
            args: --linux --x64 --publish never
            path: |
              dist-release/*.AppImage
              dist-release/*.deb
              dist-release/*.tar.gz
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          node -e "try{require('fs').unlinkSync('package-lock.json')}catch(e){}"
          npm install

      - name: Download offline ASR model
        shell: bash
        run: |
          mkdir -p build/asr-model
          BASE="https://hf-mirror.com/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main"
          # 模型与词表下载（失败不阻断构建：应用内仍可从镜像按需下载）
          curl -fsSL --retry 3 "$BASE/model.int8.onnx" -o build/asr-model/model.int8.onnx || echo "model download failed, in-app download will be used"
          curl -fsSL --retry 3 "$BASE/tokens.txt" -o build/asr-model/tokens.txt || echo "tokens download failed"
          ls -lh build/asr-model || true

      - name: Build app
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: docs/RELEASE-${{ inputs.tag_name || github.ref_name }}.md
          files: |
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
